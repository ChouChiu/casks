name: Update Casks

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Generation mode"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - full
      inspect-dmg:
        description: "Inspect DMG for metadata (macOS only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Generate cask files
        run: |
          FLAGS=""
          if [[ "${{ inputs.mode }}" == "full" ]]; then
            FLAGS="$FLAGS --full"
          fi
          if [[ "${{ inputs.inspect-dmg }}" == "true" ]]; then
            FLAGS="$FLAGS --inspect-dmg"
          fi
          bun run generate $FLAGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          git commit -m "chore: update cask files"
          git push
